<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ktHFD6ng3Pjn3NOwDlq6vjRJI/Cmi2zzeNdUEBNDlZg=' https://cdnjs.cloudflare.com; connect-src https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net; img-src data: blob:; style-src 'unsafe-inline'; font-src data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>見積書の印刷</title>
<style>
:root{--navy:#1f4e79;--line:#d9dee5;--muted:#5f6b7a;--bg:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1d2430;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
.box{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:18px;margin:0 0 4px;color:var(--navy)}
.m{color:var(--muted);font-size:13px}
.go{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700;color:#fff;background:var(--navy);cursor:pointer;margin:14px 0 8px;text-align:center;text-decoration:none}
.go.line{background:#06c755}
.sub{display:block;text-align:center;color:var(--navy);font-size:14px;padding:8px}
.err{background:#fdecea;color:#8a1f14;border-radius:10px;padding:12px}
.ok{background:#e8f5ec;border-radius:10px;padding:12px;margin-top:10px}
ol{padding-left:20px;margin:8px 0}li{margin:4px 0}
#pages img{display:block;width:100%;border:1px solid var(--line);margin:0 0 10px;background:#fff}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #c9d3df;border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .box{max-width:none;padding:0}
  .card{display:none}
  #pages img{border:0;margin:0;width:100%;max-height:100vh;object-fit:contain;break-after:page;page-break-after:always}
  #pages img:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="box">
  <div class="card" id="head">
    <h1 id="title">見積書</h1>
    <div class="m" id="who"></div>
    <div id="status" style="margin-top:10px"><span class="spin"></span>見積書を読み込んでいます…</div>
    <div id="act" hidden></div>
  </div>
  <div id="pages"></div>
</div>
<script>
(function () {
  var CONV = {
    seven: { name: 'セブン‐イレブン', bot: 'ネットプリント',
      steps: ['LINEの「ネットプリント」のトークに出る<b>予約番号（8桁）かQRコード</b>を確認', 'マルチコピー機で<b>QRコードをかざす</b>（または「プリント」→「ネットプリント」→ 予約番号）', '内容を確認 → お金を入れて印刷'] },
    fm: { name: 'ファミマ・ローソン・ミニストップ', bot: 'ネットワークプリント',
      steps: ['LINEの「ネットワークプリント」のトークで<b>ユーザー番号（10桁）かQRコード</b>を確認', 'マルチコピー機で「ネットワークプリント」→ <b>QRコードをかざす</b>（またはユーザー番号）', '内容を確認 → お金を入れて印刷'] }
  };
  var $ = function (id) { return document.getElementById(id); };
  var q = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); });
  var mode = q.m === 'conv' ? 'conv' : q.m === 'view' ? 'view' : 'print', chain = CONV[q.c] ? q.c : 'seven';
  // 合い言葉をアドレス欄と履歴から消す（あとから他の人に見られないように）
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* */ }
  var fail = function (msg) { var d = document.createElement('div'); d.className = 'err'; d.textContent = msg; $('status').innerHTML = ''; $('status').appendChild(d); };
  if (!q.u || !q.k || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(q.u)) {
    fail(mode === 'view' ? 'このリンクは正しくありません。お店の人に、もう一度QRコードを出してもらってください。' : 'このページは、見積書アプリの「自宅で印刷」「コンビニで印刷」から開いてください。'); return;
  }
  $('title').textContent = mode === 'conv' ? 'コンビニ（' + CONV[chain].name + '）で印刷' : mode === 'view' ? '見積書' : '自宅で印刷';

  var file = null, printed = false;
  var SRI = {
    'pdf.min.js': 'sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e',
    'pdf.worker.min.js': 'sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2'
  };
  // 部品は中身が決まったもの（改ざんされていないもの）だけ読み込む
  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.integrity = SRI[src.split('/').pop()]; s.crossOrigin = 'anonymous'; s.onload = res; s.onerror = function () { rej(new Error('印刷の部品を読み込めませんでした（電波を確認してください）')); }; document.head.appendChild(s); }); }
  var PJ = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', PJD = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
  function render(bytes) {
    return loadScript(PJ + 'pdf.min.js').then(function () { return loadScript(PJ + 'pdf.worker.min.js'); }).then(function () {
      return window.pdfjsLib.getDocument({ data: bytes, isEvalSupported: false, cMapUrl: PJD + 'cmaps/', cMapPacked: true, standardFontDataUrl: PJD + 'standard_fonts/' }).promise;
    }).then(function (doc) {
      var chain2 = Promise.resolve();
      for (var p = 1; p <= doc.numPages; p++) (function (p) {
        chain2 = chain2.then(function () { return doc.getPage(p); }).then(function (page) {
          var vp = page.getViewport({ scale: 2.5 }), cv = document.createElement('canvas');
          cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
          var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
          return page.render({ canvasContext: cx, viewport: vp }).promise.then(function () {
            var img = new Image(); img.alt = p + 'ページ目'; img.src = cv.toDataURL('image/jpeg', 0.92); $('pages').appendChild(img);
            return new Promise(function (r) { if (img.complete) r(); else img.onload = img.onerror = r; });
          });
        });
      })(p);
      return chain2;
    });
  }
  function doPrint() { printed = true; try { window.print(); } catch (e) { /* */ } }
  function showPrint() {
    $('status').innerHTML = '準備ができました。プリンターを選んで「印刷」を押してください。';
    $('act').hidden = false;
    $('act').innerHTML = '<button class="go" id="pr">印刷する</button>' +
      '<p class="m" style="margin:10px 0 4px"><b>プリンターが選べないときは↓</b>（プリンターのメーカーのアプリで印刷します）</p>' +
      '<button class="go line" id="ap" style="background:#2d6aa3;margin-top:4px">プリンターのアプリに送る</button>' +
      '<p class="m" style="margin:0">共有画面で「Epson Smart Panel」「Canon PRINT」「Brother Mobile Connect」など、お使いのプリンターのアプリを選んでください。</p>' +
      '<div class="err" id="ng" hidden></div>' +
      '<a class="sub" id="dl">PDFをこの端末に保存する</a>' +
      '<p class="m" style="margin:8px 0 0">印刷が終わったら、この画面は閉じてかまいません。</p>';
    $('pr').onclick = doPrint;
    $('ap').onclick = function () { shareFile('プリンターのアプリに送れませんでした。「PDFをこの端末に保存する」で保存してから、プリンターのアプリで開いてください。'); };
    setDl();
    setTimeout(doPrint, 300); // 自動で印刷画面を出す（出ないときは「印刷する」を押す）
  }
  /** スマホの共有画面にPDFを渡す（LINE・プリンターのアプリなど） */
  function shareFile(ngMsg, onDone) {
    var ng = $('ng');
    var can = false; try { can = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { can = false; }
    if (!can) { ng.hidden = false; ng.textContent = 'この端末では共有画面が使えません。' + ngMsg; return; }
    navigator.share({ files: [file] }).then(function () { ng.hidden = true; if (onDone) onDone(); })
      .catch(function (e) { if (e && e.name === 'AbortError') return; ng.hidden = false; ng.textContent = '送れませんでした（' + (e && e.message || e) + '）。' + ngMsg; });
  }
  function showConv() {
    var c = CONV[chain];
    $('status').innerHTML = '下のボタンを押すと共有画面が開きます。<b>「LINE」→「' + c.bot + '」</b>を選んで送信してください。';
    $('act').hidden = false;
    $('act').innerHTML = '<button class="go line" id="sh">LINEで「' + c.bot + '」に送る</button><a class="sub" id="dl">PDFをこの端末に保存する</a>' +
      '<p class="m" style="margin:0 0 6px">うまく送れないとき：「PDFをこの端末に保存する」→ LINEの「' + c.bot + '」のトークで「＋」→「ファイル」から保存したPDFを選ぶ</p>' +
      '<div class="ok" id="done" hidden><b>送ったら、あとは店で↓</b><ol>' + c.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>' +
      '<div class="err" id="ng" hidden></div>';
    setDl();
    $('sh').onclick = function () {
      shareFile('「PDFをこの端末に保存する」で保存してから、LINEの「' + c.bot + '」のトークで「＋」→「ファイル」から送ってください。', function () { $('done').hidden = false; });
    };
  }
  /** お客さんに見せる：見積書を表示するだけ（印刷画面は出さない） */
  function showView(d) {
    $('status').innerHTML = '';
    $('status').appendChild(document.createTextNode(d.untilText ? '今日の' + d.untilText + 'まで見られます。' : ''));
    $('act').hidden = false;
    $('act').innerHTML = '<a class="go" id="dl" style="margin-bottom:0">PDFをこの端末に保存する</a>';
    setDl();
  }
  function setDl() { var a = $('dl'); a.href = URL.createObjectURL(file); a.download = file.name; }

  fetch(q.u + '?p=pdf&k=' + encodeURIComponent(q.k), { credentials: 'omit', referrerPolicy: 'no-referrer' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.expired && mode === 'view') throw new Error('この見積書を見られる時間（30分）が過ぎました。お店の人に、もう一度QRコードを出してもらってください。');
      if (!d || d.error) throw new Error(d && d.error || '読み込めませんでした');
      $('who').textContent = (d.atena || '') + '　' + (d.no || '');
      var b = atob(d.b64), u = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      file = new File([u], d.name || '見積書.pdf', { type: 'application/pdf' });
      if (mode === 'conv') { showConv(); return render(u.slice()); }
      if (mode === 'view') { $('status').innerHTML = '<span class="spin"></span>見積書を表示しています…'; return render(u.slice()).then(function () { showView(d); }); }
      $('status').innerHTML = '<span class="spin"></span>印刷の準備をしています…';
      return render(u.slice()).then(showPrint);
    })
    .catch(function (e) { fail((e && e.message) || String(e)); });
})();
</script>
</body>
</html>
